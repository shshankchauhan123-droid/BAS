[project]
name = "bas-backend"
version = "1.0.0"
description = "BAS FastAPI Backend"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/venv",
    "/.venv",
    "/dist",
    "/__pycache__",
    "*.pyc",
    "/storage",
    "/.env",
]
